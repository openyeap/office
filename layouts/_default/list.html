{{ define "main" }}
<section class="pt-24 pb-16 bg-white">
  <div class="max-w-content mx-auto px-4">
    <h1 class="text-3xl sm:text-4xl font-bold text-deep mb-2">{{ .Title }}</h1>
    {{ with .Description }}<p class="text-gray-500 mb-10">{{ . }}</p>{{ end }}
    <div class="prose prose-gray max-w-none text-sm text-gray-600 leading-relaxed mb-10">
      {{ .Content }}
    </div>
    {{ if .Pages }}
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      {{ range .Pages }}
      <a href="{{ .RelPermalink }}" class="card-hover bg-white rounded-xl p-6 shadow-sm border border-gray-100 no-underline block">
        <h3 class="font-bold text-deep mb-2 text-lg">{{ .Title }}</h3>
        {{ with .Description }}<p class="text-sm text-gray-500 leading-relaxed">{{ . }}</p>{{ end }}
      </a>
      {{ end }}
    </div>
    {{ end }}
  </div>
</section>
{{ end }}
